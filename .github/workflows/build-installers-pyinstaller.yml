name: Build installers (Pyinstaller + Electron)

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            platform: windows
            arch: x64
            server-binary: skellycam_server.exe
            electron-arch: x64

          # macOS Intel (x64) — macos-15-intel is the standard free runner
          # replacing the retired macos-13. Available until ~Aug 2027.
          - os: macos-15-intel
            platform: macos
            arch: x64
            server-binary: skellycam_server
            electron-arch: x64

          # macOS Apple Silicon (arm64) — macos-latest is arm64 (macos-15)
          - os: macos-latest
            platform: macos
            arch: arm64
            server-binary: skellycam_server
            electron-arch: arm64

          # Linux x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            server-binary: skellycam_server
            electron-arch: x64

          # Linux ARM64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            server-binary: skellycam_server
            electron-arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Windows code-signing prereqs (Windows only) ──
      - name: Validate code signing prerequisites
        if: matrix.platform == 'windows'
        run: |
          $missingSecrets = @()

          if (-not "${{ secrets.AZURE_TENANT_ID }}") { $missingSecrets += "AZURE_TENANT_ID" }
          if (-not "${{ secrets.AZURE_CLIENT_ID }}") { $missingSecrets += "AZURE_CLIENT_ID" }
          if (-not "${{ secrets.AZURE_CLIENT_SECRET }}") { $missingSecrets += "AZURE_CLIENT_SECRET" }
          if (-not "${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}") { $missingSecrets += "TRUSTED_SIGNING_ACCOUNT_NAME" }
          if (-not "${{ secrets.CERTIFICATE_PROFILE_NAME }}") { $missingSecrets += "CERTIFICATE_PROFILE_NAME" }

          if ($missingSecrets.Count -gt 0) {
            Write-Error "Missing required secrets for code signing: $($missingSecrets -join ', ')"
            exit 1
          }

          Write-Output "All required code signing secrets are available"
        shell: pwsh

      # ── Linux system dependencies ──
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1 \
            libv4l-dev \
            libfuse2 \
            upx-ucl

      # ── macOS UPX for binary compression ──
      - name: Install UPX (macOS)
        if: matrix.platform == 'macos'
        run: brew install upx

      # ── Common setup ──
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv and enable cache
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Create venv
        run: uv venv

      - name: Install the project dependencies
        run: uv sync

      - name: Verify installation 1/3
        run: uv pip show skellycam
      - name: Verify installation 2/3
        run: uv pip show pyinstaller
      - name: Verify installation 3/3
        run: uv pip show opencv-contrib-python

      # ── PyInstaller build ──
      - name: Build with PyInstaller
        run: |
          uv pip install pyinstaller
          uv run pyinstaller ./skellycam.spec --clean

      # ── Move server binary into skellycam-ui/ ──
      - name: Move server binary into skellycam-ui (Windows)
        if: matrix.platform == 'windows'
        run: |
          Move-Item -Path ".\dist\${{ matrix.server-binary }}" -Destination ".\skellycam-ui\${{ matrix.server-binary }}"

      - name: Move server binary into skellycam-ui (macOS/Linux)
        if: matrix.platform != 'windows'
        run: |
          mv "./dist/${{ matrix.server-binary }}" "./skellycam-ui/${{ matrix.server-binary }}"
          chmod +x "./skellycam-ui/${{ matrix.server-binary }}"

      # ── Windows code signing (server binary) ──
      - name: Sign skellycam_server.exe with Trusted Signing
        if: matrix.platform == 'windows'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\skellycam-ui\skellycam_server.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ── Upload server-only artifact ──
      - name: Upload server binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: skellycam-SERVER-ONLY-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            skellycam-ui/${{ matrix.server-binary }}
          include-hidden-files: true

      # ── Electron build ──
      - name: Install UI dependencies
        run: |
          cd skellycam-ui
          npm install

      - name: Build UI (Windows)
        if: matrix.platform == 'windows'
        run: |
          cd skellycam-ui
          npm run build

      - name: Build UI (macOS)
        if: matrix.platform == 'macos'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          cd skellycam-ui
          npm run build -- --${{ matrix.electron-arch }}

      - name: Build UI (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd skellycam-ui
          npm run build -- --${{ matrix.electron-arch }}

      # ── Windows installer signing ──
      - name: Sign Electron installer with Trusted Signing
        if: matrix.platform == 'windows'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\skellycam-ui\release
          files-folder-filter: "*.exe"
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ── Upload final installer artifacts ──
      - name: Upload installer artifacts (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: skellycam-FULL-APP-installer-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            skellycam-ui/release/*/skellycam_*_installer.exe
          include-hidden-files: true

      - name: Upload installer artifacts (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: skellycam-FULL-APP-installer-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            skellycam-ui/release/*/*.dmg
            skellycam-ui/release/*/*.zip
          include-hidden-files: true

      - name: Upload installer artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: skellycam-FULL-APP-installer-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            skellycam-ui/release/*/*.AppImage
            skellycam-ui/release/*/*.deb
          include-hidden-files: true
