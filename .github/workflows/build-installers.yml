name: Build installers

on:
    push:
        branches:
        - jon/development
    workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]  # Start with Windows first
        include:
          - os: windows-latest
            venv-activate: .venv\Scripts\activate
#    continue-on-error: true
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv and enable cache
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --dev

      - name: Install Python dependencies
        run: uv sync


      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: skellycam/__main__.py
          mode: onefile
          windows-icon-from-ico: shared/skellycam-logo/skellycam-favicon.ico
          output-file: skellycam_server.exe
          output-dir: skellycam-ui/


      - name: Check Nuitka build
        if: ${{ github.event.inputs.test-mode != 'true' }}
        run: |
          ls -l skellycam-ui/skellycam_server.exe

      - name: Install UI dependencies
        run: |
          cd skellycam-ui
          npm install

      - name: Build UI
        run: |
          cd skellycam-ui
          npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skellycam-${{ runner.os }}
          path: |
            skellycam-ui/skellycam_server.exe
            skellycam-ui/releases/*/skellycam_*_installer.exe
          include-hidden-files: true