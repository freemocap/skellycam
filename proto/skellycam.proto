syntax = "proto3";

package skellycam;

// Service definition
service SkellycamService {
  // Stream camera frames to the client
  rpc StreamMultiFrames(MultiFrameRequest) returns (stream MultiFrameResponse);

  // Send frame acknowledgment from client to server
  rpc AcknowledgeMultiFrame(MultiFrameAcknowledgment) returns (AcknowledgmentResponse);

  // Stream log messages to the client
  rpc StreamLogs(LogRequest) returns (stream LogRecord);

  // Stream framerate updates to the client
  rpc StreamFramerates(FramerateRequest) returns (stream FramerateUpdate);
}

// Request for starting frame streaming
message MultiFrameRequest {
  // Optional display image sizes for each camera
  map<string, CameraDisplaySize> display_image_sizes = 1;
  // Last received frame number for resuming stream
  int64 last_received_frame_number = 2;
}

// Camera display size information
message CameraDisplaySize {
  float width = 1;
  float height = 2;
}

// MultiFrame response containing camera images
message MultiFrameResponse {
  // MultiFrame metadata
  int64 frame_number = 1;
  string camera_group_id = 2;
  double timestamp = 3;

  // Camera frames
  repeated CameraMultiFrame camera_frames = 4;
}

// Individual camera frame
message CameraMultiFrame {
  string camera_id = 1;
  int32 camera_index = 2;
  int32 image_width = 3;
  int32 image_height = 4;
  int32 color_channels = 5;
  bytes jpeg_data = 6;
}

// MultiFrame acknowledgment from client
message MultiFrameAcknowledgment {
  int64 frame_number = 1;
  map<string, CameraDisplaySize> display_image_sizes = 2;
}

// Acknowledgment response
message AcknowledgmentResponse {
  bool success = 1;
}

// Request for log streaming
message LogRequest {
  // Minimum log level to receive
  LogLevel min_level = 1;
}

// Log severity levels
enum LogLevel {
  TRACE = 0;
  DEBUG = 1;
  INFO = 2;
  SUCCESS = 3;
  WARNING = 4;
  ERROR = 5;
  CRITICAL = 6;
}

// Log record message
message LogRecord {
  string name = 1;
  string message = 2;
  repeated string args = 3;
  string level_name = 4;
  int32 level_no = 5;
  string pathname = 6;
  string filename = 7;
  string module = 8;
  string exc_info = 9;
  string exc_text = 10;
  string stack_info = 11;
  int32 line_no = 12;
  string func_name = 13;
  double created = 14;
  double msecs = 15;
  double relative_created = 16;
  int64 thread = 17;
  string thread_name = 18;
  string process_name = 19;
  int32 process = 20;
  string delta_t = 21;
  string formatted_message = 22;
  string asctime = 23;
  string type = 24;
}

// Request for framerate updates
message FramerateRequest {
  // Optional camera group ID to filter updates
  string camera_group_id = 1;
}

// Framerate update message
message FramerateUpdate {
  string camera_group_id = 1;
  FramerateData backend_framerate = 2;
  FramerateData frontend_framerate = 3;
}

// Framerate data
message FramerateData {
  double fps = 1;
  double frame_time_ms = 2;
  string source = 3;
  repeated double recent_frame_durations = 4;
}