<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simplified H264 Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            text-align: center;
        }

        #videoCanvas {
            border: 2px solid #4CAF50;
            background: #000;
            display: block;
            margin: 20px auto;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #startBtn { background: #4CAF50; color: white; }
        #stopBtn { background: #f44336; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #status {
            margin: 20px;
            padding: 10px;
            background: #333;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Simplified H264 Streaming (All Keyframes)</h1>

    <canvas id="videoCanvas" width="1280" height="720"></canvas>

    <div>
        <button id="startBtn" onclick="start()">Start</button>
        <button id="stopBtn" onclick="stop()" disabled>Stop</button>
    </div>

    <div id="status">
        <p>Status: <span id="statusText">Disconnected</span></p>
        <p>Frames: <span id="frameCount">0</span></p>
        <p>FPS: <span id="fps">0</span></p>
    </div>

<script>
class SimpleH264Client {
    constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.decoder = null;
        this.ws = null;
        this.frameCount = 0;
        this.lastTime = performance.now();
        this.fpsCounter = 0;
        this.fpsTime = performance.now();
    }

    async connect() {
        return new Promise((resolve, reject) => {
            this.ws = new WebSocket('ws://localhost:8000/stream');

            this.ws.onopen = () => {
                console.log('Connected');
                document.getElementById('statusText').textContent = 'Connected';
                resolve();
            };

            this.ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);

                if (msg.type === 'config') {
                    // Initialize decoder with simple config
                    await this.initDecoder(msg.config);

                } else if (msg.type === 'frame') {
                    // Decode the keyframe
                    await this.decodeFrame(msg);
                }
            };

            this.ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                document.getElementById('statusText').textContent = 'Error';
                reject(error);
            };

            this.ws.onclose = () => {
                console.log('Disconnected');
                document.getElementById('statusText').textContent = 'Disconnected';
                this.cleanup();
            };
        });
    }

    async initDecoder(config) {
        try {
            // Simple decoder config for baseline H264
            const decoderConfig = {
                codec: 'avc1.42001e', // Baseline profile, level 3.0
                codedWidth: config.width,
                codedHeight: config.height,
                hardwareAcceleration: 'prefer-hardware'
            };

            // Check support
            const support = await VideoDecoder.isConfigSupported(decoderConfig);
            if (!support.supported) {
                throw new Error('Codec not supported');
            }

            // Create decoder
            this.decoder = new VideoDecoder({
                output: (frame) => {
                    // Draw frame to canvas
                    this.ctx.drawImage(frame, 0, 0);
                    frame.close();

                    // Update stats
                    this.frameCount++;
                    document.getElementById('frameCount').textContent = this.frameCount;

                    // Calculate FPS
                    this.fpsCounter++;
                    const now = performance.now();
                    if (now - this.fpsTime > 1000) {
                        const fps = Math.round(this.fpsCounter * 1000 / (now - this.fpsTime));
                        document.getElementById('fps').textContent = fps;
                        this.fpsCounter = 0;
                        this.fpsTime = now;
                    }
                },
                error: (e) => {
                    console.error('Decoder error:', e);
                    document.getElementById('statusText').textContent = 'Decoder error';
                }
            });

            this.decoder.configure(decoderConfig);
            console.log('Decoder ready');
            document.getElementById('statusText').textContent = 'Streaming';

        } catch (error) {
            console.error('Failed to init decoder:', error);
            document.getElementById('statusText').textContent = 'Init failed';
        }
    }

    async decodeFrame(msg) {
        if (!this.decoder || this.decoder.state !== 'configured') {
            return;
        }

        try {
            // Decode base64 to bytes
            const h264Data = this.base64ToBytes(msg.data);

            // Create video chunk (always keyframe in this simplified version)
            const chunk = new EncodedVideoChunk({
                type: 'key',  // Always keyframe
                timestamp: msg.timestamp * 1000000, // Convert to microseconds
                data: h264Data
            });

            // Decode the chunk
            this.decoder.decode(chunk);

        } catch (error) {
            console.error('Decode error:', error);
        }
    }

    base64ToBytes(base64) {
        const binaryString = atob(base64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes;
    }

    disconnect() {
        if (this.ws) {
            this.ws.close();
        }
        this.cleanup();
    }

    cleanup() {
        if (this.decoder && this.decoder.state !== 'closed') {
            this.decoder.close();
        }
        this.decoder = null;
        this.frameCount = 0;
    }
}

let client = null;

async function start() {
    document.getElementById('startBtn').disabled = true;

    try {
        client = new SimpleH264Client('videoCanvas');
        await client.connect();
        document.getElementById('stopBtn').disabled = false;
    } catch (error) {
        console.error('Failed to start:', error);
        document.getElementById('startBtn').disabled = false;
    }
}

function stop() {
    if (client) {
        client.disconnect();
        client = null;
    }
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('frameCount').textContent = '0';
    document.getElementById('fps').textContent = '0';
}
</script>
</body>
</html>
