[package]
name = "skellycam"
version = "0.1.0"
edition = "2024"

[features]
default = ["nokhwa-backend"]
nokhwa-backend = ["dep:nokhwa"]
opencv-backend = ["dep:opencv"]

[dependencies]
# Camera backends — switchable via Cargo features
# Default: nokhwa MSMF
# cargo build --features opencv-backend  →  opencv DirectShow
nokhwa = { version = "0.10.10", features = ["input-native"], optional = true }
opencv = { git = "https://github.com/twistedfall/opencv-rust.git", default-features = false, features = ["videoio", "imgproc", "imgcodecs"], optional = true }

# Image processing (rotation, resize, JPEG encode)
image = "0.25"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server + WebSocket
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Serialization (JSON)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OpenAPI documentation
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Safe zero-copy transmutation
bytemuck = { version = "1", features = ["derive"] }

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Time and date handling
chrono = "0.4"

# Streaming CSV output (for timestamp logging)
csv = "1"

# ffmpeg binary auto-download and caching
ffmpeg-sidecar = "2"

# Platform-specific: high-precision monotonic clock
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Performance"] }
