[package]
name = "skellycam"
version = "0.1.0"
edition = "2024"

[dependencies]
# Camera capture — OpenCV (DirectShow/V4L2/AVFoundation)
opencv = { version = "0.98", default-features = false, features = ["videoio", "imgproc", "imgcodecs"] }

# Image processing (rotate, resize, JPEG encode/decode)
image = "0.25"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP + WebSocket
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OpenAPI docs
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# Time
chrono = "0.4"

# Streaming CSV
csv = "1"

# ffmpeg auto-download
ffmpeg-sidecar = "2"

# DataFrames (Phase 3 — recording)
# polars = { version = "0.41", features = ["lazy", "csv-file"] }