[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "skellycam-rust"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "_skellycam_rust"

[tool.uv]
# Rebuild the wheel when native sources change, not just metadata. [@uvCacheKeys]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "build.rs" },
    { file = "src/**/*.rs" },
]
