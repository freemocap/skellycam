[project]
name = "skellycam"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.11"


authors = [
    { name = "Skelly FreeMoCap", email = "info@freemocap.org" },
    { name = "Endurance Idehen" },
    { name = "Jonathan Samir Matthis" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: System :: Hardware",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Video (UVC)",
]
keywords = [
    "camera",
    "stream",
    "video",
    "image",
    "opencv",
    "skelly",
    "freemocap",
    "motion capture",
    "synchronization",
    "computer vision",
]

dependencies = [
    "numpy==1.26.2",
    "opencv-contrib-python==4.10.*",
    "pydantic==2.*",
    "Pillow",
    "psutil==5.9.6",
    "setproctitle==1.3.3",
    "scipy>=1.11.4",
    "pandas",
    "uvicorn>=0.30.6",
    "fastapi>=0.115.0",
    "tzlocal>=5.2",
    "httpx>=0.27.2",
    "websockets>=13.1",
    "sounddevice>=0.4.6",
    "av>=12.0.0",
    "tabulate>=0.9.0",
    "numpydantic>=1.6.9",
    "cv2-enumerate-cameras>=1.2.2",
    "skellylogs",
    "skellypings",
]
[tool.uv.sources]
skellylogs = { git = "https://github.com/freemocap/skellylogs" }
skellypings = { git = "https://github.com/freemocap/skellypings" }

[tool.uv]
package = true


[project.urls]
Homepage = "https://github.com/freemocap/skellycam"

[project.scripts]
skellycam = "skellycam.__main__:entry_point"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.bumpver]
current_version = "v2024.09.1094"
version_pattern = "vYYYY.0M.BUILD[-TAG]"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"skellycam/__init__.py" = ["{version}"]


# =============================================================================
# Dev dependencies
# =============================================================================
# Install with:  uv sync --group dev
# =============================================================================

[dependency-groups]
dev = [
    "bumpver",
    "pip-tools",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24.0",
    "nuitka>=2.7.7",
    "pyinstaller>=6.15.0",
    "ruff>=0.9.0",
    "poethepoet>=0.32.0",
]


# =============================================================================
# Task runner (poethepoet)
# =============================================================================
# List all tasks:        uv run poe --help
#
# Type-checking imports:
#   uv run poe tc-check    Preview which imports can move behind TYPE_CHECKING
#   uv run poe tc-fix      Move them automatically
#   uv run poe tc          Move them + run tests to verify nothing broke
#
# Linting:
#   uv run poe lint        Run all ruff lint rules (report only)
#   uv run poe lint-fix    Auto-fix all ruff lint violations
#
# Testing:
#   uv run poe test        Run pytest
#
# ---- Handling false positives ----
#
# Ruff is smart about isinstance/issubclass — it won't move imports that
# appear in those calls. But if ruff tries to move an import that IS used
# at runtime (e.g. passed to a registry, used in a TypeAdapter, or checked
# in a way ruff can't see), suppress it with a noqa comment on the import:
#
#   from freemocap.core.pipeline.pipeline_configs import DetectorSpec  # noqa: TC001
#
# The rule codes are:
#   TC001 — stdlib import (e.g. pathlib.Path used in isinstance)
#   TC002 — third-party import (e.g. numpy.ndarray used in isinstance)
#   TC003 — first-party import (e.g. your own types used in isinstance)
#
# Common situations where you MUST keep an import at runtime (use noqa):
#   - isinstance(x, SomeClass) / issubclass(x, SomeClass)
#     (ruff usually catches these, but check if it doesn't)
#   - TypeAdapter(SomeModel) or model_validate() with a type argument
#   - Passing a class to a function that does runtime type inspection
#   - Using a class as a dict key or in a set for type dispatch
#   - Base classes (class Foo(SomeBase):) — ruff always catches these
#
# =============================================================================

[tool.poe.tasks]
tc-check = { cmd = "ruff check --select TC skellycam/", help = "Preview type-only imports that can move behind TYPE_CHECKING" }
tc-fix   = { cmd = "ruff check --select TC --fix skellycam/", help = "Move type-only imports behind TYPE_CHECKING" }
tc       = { sequence = ["tc-fix", "test"], help = "Move type-only imports + run tests to verify" }
lint     = { cmd = "ruff check skellycam/", help = "Run all ruff lint rules" }
lint-fix = { cmd = "ruff check --fix skellycam/", help = "Auto-fix all ruff lint violations" }
test     = { cmd = "pytest", help = "Run test suite" }


# =============================================================================
# Pytest config
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["skellycam/tests"]
asyncio_mode = "auto"

# =============================================================================
# Ruff linter config
# =============================================================================
# TC rules move imports that are ONLY used in type annotations behind an
# `if TYPE_CHECKING:` block, so they don't execute at runtime. This makes
# multiprocessing child process spawns faster (fewer files to import).
#
# Ruff automatically detects and preserves imports used in:
#   - isinstance() / issubclass() calls
#   - Base classes
#   - Default values and runtime expressions
#   - Pydantic field types (via runtime-evaluated-base-classes below)
#   - Dataclass field types (via runtime-evaluated-decorators below)
#
# If ruff incorrectly flags an import that IS needed at runtime,
# add  # noqa: TC003  (or TC001/TC002) to that import line.
# =============================================================================

[tool.ruff.lint]
select = [
    "TC",    # flake8-type-checking: move type-only imports behind TYPE_CHECKING
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates field type annotations at runtime for validation/serialization.
# Imports used as field types on these base classes must NOT be moved behind
# TYPE_CHECKING or Pydantic will fail at class creation.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic.BaseSettings",
]
runtime-evaluated-decorators = [
    "dataclasses.dataclass",
]
exempt-modules = ["typing", "typing_extensions"]
